<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Chan zone</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@200;300;400&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">

  <!-- ── Title Bar ── -->
  <div class="titlebar">
    <span class="brand">
      <svg class="brand-mark" width="22" height="12" viewBox="0 0 44 24" fill="none" aria-hidden="true">
        <path d="M5 8 Q13 2 21 8 T39 8" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"/>
        <path d="M9 15 Q15 10 21 15 T35 15" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
      </svg>
      <span>Chan zone</span>
    </span>
    <div class="titlebar-right">
      <button class="icon-btn" id="btn-compact" title="极简模式">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <path d="M8 3H5a2 2 0 0 0-2 2v3"/>
          <path d="M16 3h3a2 2 0 0 1 2 2v3"/>
          <path d="M8 21H5a2 2 0 0 1-2-2v-3"/>
          <path d="M16 21h3a2 2 0 0 0 2-2v-3"/>
        </svg>
      </button>
      <button class="icon-btn" id="btn-settings" title="设置">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
      </button>
      <button class="win-btn btn-min"   id="btn-min"   title="最小化"></button>
      <button class="win-btn btn-close" id="btn-close" title="隐藏"></button>
    </div>
  </div>

  <!-- ── Task ── -->
  <div class="task-area">
    <input class="task-input" id="task-input" type="text"
           value="专注工作" placeholder="输入工作事项…" maxlength="28" spellcheck="false">
  </div>

  <!-- ── Mode Tabs ── -->
  <div class="mode-tabs">
    <button class="mode-btn active" data-mode="focus">专注</button>
    <button class="mode-btn" data-mode="short">小憩</button>
    <button class="mode-btn" data-mode="long">长休</button>
  </div>

  <!-- ── Clock ── -->
  <div class="clock-face">
    <svg class="clock-svg" viewBox="0 0 220 220">
      <defs>
        <!-- Brushstroke distortion filter for enso -->
        <filter id="enso-brush" x="-10%" y="-10%" width="120%" height="120%">
          <feTurbulence type="fractalNoise" baseFrequency="0.038 0.028"
                        numOctaves="2" seed="12" result="noise"/>
          <feDisplacementMap in="SourceGraphic" in2="noise"
                             scale="2.6" xChannelSelector="R" yChannelSelector="G"/>
        </filter>
      </defs>

      <!-- Enso ring: open brushstroke circle (Suzuki Daisetsu's ensō) -->
      <!-- r=97, circumference≈609.7 → dasharray 568 gap 42 ≈ 335° visible, 25° gap -->
      <circle class="enso" cx="110" cy="110" r="97"
              stroke-dasharray="568 42" stroke-dashoffset="10"
              filter="url(#enso-brush)"/>

      <!-- Thin inner progress track + arc -->
      <circle class="track"    cx="110" cy="110" r="86"/>
      <circle class="progress" id="progress-ring" cx="110" cy="110" r="86"
              stroke-dasharray="540.35" stroke-dashoffset="0"/>
    </svg>

    <!-- Inner disc: plain background (no backdrop-filter inside transparent window) -->
    <div class="clock-inner"></div>

    <div class="time-display">
      <div class="time-num" id="time-display">25:00</div>
      <div class="session-label" id="session-label">第 1 轮</div>
    </div>
  </div>

  <!-- ── Duration (focus mode only) ── -->
  <div class="duration-row" id="duration-row">
    <span class="dur-label">时长</span>
    <input class="dur-input" id="dur-input" type="number" min="1" max="120" value="25">
    <span class="dur-unit">分钟</span>
  </div>

  <!-- ── Controls ── -->
  <div class="controls">
    <button class="ctrl-btn" id="btn-reset" title="重置">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
        <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
        <path d="M3 3v5h5"/>
      </svg>
    </button>

    <button class="ctrl-btn play-btn" id="btn-play" aria-label="开始/暂停">
      <svg id="play-svg" width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
        <polygon points="6,3 20,12 6,21"/>
      </svg>
    </button>

    <button class="ctrl-btn" id="btn-skip" title="跳过">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor">
        <polygon points="5,4 15,12 5,20"/>
        <rect x="17" y="4" width="2.5" height="16" rx="1"/>
      </svg>
    </button>
  </div>

  <!-- ── Save mid-session (shows when paused with elapsed time) ── -->
  <button class="save-btn" id="btn-save-now">
    <svg width="11" height="11" viewBox="0 0 24 24" fill="none"
         stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
      <rect x="3" y="4" width="18" height="18" rx="2"/>
      <line x1="16" y1="2" x2="16" y2="6"/>
      <line x1="8"  y1="2" x2="8"  y2="6"/>
      <line x1="3"  y1="10" x2="21" y2="10"/>
    </svg>
    <span>记录此段到日历</span>
  </button>

  <!-- ── Session Dots ── -->
  <div class="dots" id="dots">
    <div class="dot current" id="d0"></div>
    <div class="dot" id="d1"></div>
    <div class="dot" id="d2"></div>
    <div class="dot" id="d3"></div>
  </div>

  <!-- ── Zen Quote ── -->
  <div class="quote" id="quote">需要的不多，想要的太多。</div>
  <div class="quote-author">— 圣严法师 · 108自在语</div>

  <!-- ══ Settings Panel ══ -->
  <div class="settings-panel" id="settings-panel">
    <div class="settings-header">
      <span class="settings-title">设置</span>
      <button class="icon-btn" id="btn-settings-close">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <line x1="18" y1="6"  x2="6"  y2="18"/>
          <line x1="6"  y1="6"  x2="18" y2="18"/>
        </svg>
      </button>
    </div>
    <div class="settings-body">

      <div class="setting-group">
        <span class="setting-group-label">计时时长</span>
        <div class="setting-row">
          <span class="setting-row-label">专注</span>
          <input class="setting-input" id="s-focus" type="number" min="1" max="120" value="25">
          <span class="s-unit">分</span>
        </div>
        <div class="setting-row">
          <span class="setting-row-label">小憩</span>
          <input class="setting-input" id="s-short" type="number" min="1" max="30"  value="5">
          <span class="s-unit">分</span>
        </div>
        <div class="setting-row">
          <span class="setting-row-label">长休</span>
          <input class="setting-input" id="s-long"  type="number" min="1" max="60"  value="15">
          <span class="s-unit">分</span>
        </div>
      </div>

      <div class="setting-group">
        <span class="setting-group-label">音效</span>
        <div class="setting-row">
          <span class="setting-row-label">木鱼 · 引磬</span>
          <select class="setting-select" id="s-sound-enable">
            <option value="1">开启</option>
            <option value="0">关闭</option>
          </select>
        </div>
        <div class="sound-test-row">
          <button class="test-btn" id="btn-test-mokugyo">▶ 木鱼</button>
          <button class="test-btn" id="btn-test-rin">▶ 引磬</button>
        </div>
      </div>

      <div class="setting-group">
        <span class="setting-group-label">苹果日历</span>
        <div class="setting-row">
          <span class="setting-row-label">同步日历</span>
          <select class="setting-select" id="s-cal-enable">
            <option value="1">开启</option>
            <option value="0">关闭</option>
          </select>
        </div>
        <div class="setting-row">
          <span class="setting-row-label">日历名称</span>
          <input class="setting-input" id="s-cal-name" type="text"
                 value="日历" placeholder="日历 / Calendar" spellcheck="false">
        </div>
        <div class="cal-status-bar">
          <div class="cal-indicator" id="cal-dot"></div>
          <span class="cal-status-text" id="cal-status-text">尚未测试连接</span>
          <button class="test-btn" id="btn-test-cal">测试连接</button>
        </div>
      </div>

    </div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

</div>
<script src="renderer.js"></script>
</body>
</html>
